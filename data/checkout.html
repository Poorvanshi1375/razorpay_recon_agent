<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Pay Test Orders</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .row span.label {
      flex: 1;
    }

    .row button {
      padding: 6px 16px;
      cursor: pointer;
    }

    .status {
      color: #2a7;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <h2>Test Orders — click Pay for each one</h2>
  <p>Card: 4111 1111 1111 1111, any future expiry, any CVV, OTP = any 4-10 digits.<br />
    UPI: success@razorpay (auto-succeeds, no OTP).</p>
  <div id="order-list"></div>

  <script>
    // Paste your test Key ID here — the Key ID (not the secret) is safe to use client-side.
    const KEY_ID = "rzp_test_TTI3cUKFsNZ42a";

    fetch("orders_to_pay.json")
      .then((res) => res.json())
      .then((orders) => {
        const container = document.getElementById("order-list");

        orders.forEach((order) => {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <span class="label">${order.receipt} — ₹${(order.amount / 100).toFixed(2)} — ${order.order_id}</span>
            <button id="btn-${order.order_id}">Pay</button>
            <span class="status" id="status-${order.order_id}"></span>
          `;
          container.appendChild(row);

          document.getElementById(`btn-${order.order_id}`).onclick = () => {
            const options = {
              key: KEY_ID,
              amount: order.amount,
              currency: "INR",
              order_id: order.order_id,
              name: "Test Merchant",
              description: order.receipt,
              handler: function (response) {
                document.getElementById(`status-${order.order_id}`).innerText =
                  `PAID — ${response.razorpay_payment_id}`;
              },
              prefill: {
                name: "Test Buyer",
                email: "test.buyer@example.com",
                contact: "9999999999",
              },
              theme: { color: "#3399cc" },
            };
            new Razorpay(options).open();
          };
        });
      });
  </script>
</body>

</html>
